
name: Build and Deploy Orbit Project

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "633160613557"
  FRONTEND_REPOSITORY: orbit-frontend
  BACKEND_REPOSITORY: orbit-backend

jobs:
  build-and-push:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.FRONTEND_REPOSITORY }}:latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BACKEND_REPOSITORY }}:latest

  deploy:
    name: Deploy Application to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate SSH Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -eu

          test -n "$EC2_HOST" || {
            echo "ERROR: EC2_HOST secret is missing."
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "ERROR: EC2_SSH_KEY secret is missing."
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" |
            tr -d '\r' > "$HOME/.ssh/ec2_key"

          chmod 600 "$HOME/.ssh/ec2_key"

          ssh-keygen -y -f "$HOME/.ssh/ec2_key" \
            > /dev/null

          echo "SSH private key format is valid."

      - name: Check EC2 SSH Port
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -eu

          timeout 10 bash -c \
            'exec 3<>/dev/tcp/$1/22' _ "$EC2_HOST" || {
              echo "ERROR: EC2 port 22 is unreachable."
              echo "Check EC2_HOST and the EC2 security group."
              exit 1
            }

          echo "EC2 SSH port is reachable."

      - name: Configure SSH Host Key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -eu

          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keyscan -T 10 -H "$EC2_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null

          echo "Host key collected."
          echo "For production, verify its fingerprint independently."

      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            'echo "SSH connection successful"'

      - name: Prepare EC2 Deployment Directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" \
            'mkdir -p ~/orbitproject'

      - name: Copy Docker Compose File
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          scp \
            -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            docker-compose.yaml \
            ubuntu@"$EC2_HOST":/home/ubuntu/orbitproject/docker-compose.yml

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            ubuntu@"$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION' AWS_ACCOUNT_ID='$AWS_ACCOUNT_ID' FRONTEND_REPOSITORY='$FRONTEND_REPOSITORY' BACKEND_REPOSITORY='$BACKEND_REPOSITORY' bash -s" <<'REMOTE'
          set -eu

          cd ~/devops-task-manager

          if [ ! -f .env ]; then
            echo "ERROR: ~/devops-task-manager/.env is missing."
            exit 1
          fi

          command -v aws >/dev/null 2>&1 || {
            echo "ERROR: AWS CLI is not installed."
            exit 1
          }

          docker compose version >/dev/null 2>&1 || {
            echo "ERROR: Docker Compose is not installed."
            exit 1
          }

          # EC2 must have an attached IAM role with ECR pull permissions.
          aws sts get-caller-identity

          # Authenticate Docker to ECR.
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Use the same commit-specific tags pushed by GitHub Actions.
          export FRONTEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_REPOSITORY}:${IMAGE_TAG}"
          export BACKEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${BACKEND_REPOSITORY}:${IMAGE_TAG}"

          # Validate Compose configuration before changing running containers.
          docker compose config --quiet

          # Pull the images and deploy.
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE
